services:
  gemini-cli:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: gemini-cli-worker
    networks:
      - daunt-network
    ports:
      - "8787:8787"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  daunt-network:
    external: true
    driver: bridge
