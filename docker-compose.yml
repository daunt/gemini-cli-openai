services:
  gemini-cli:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        - GCP_SERVICE_ACCOUNT=${GCP_SERVICE_ACCOUNT}
        - GEMINI_PROJECT_ID=${GEMINI_PROJECT_ID}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - ENABLE_FAKE_THINKING=${ENABLE_FAKE_THINKING}
        - ENABLE_REAL_THINKING=${ENABLE_REAL_THINKING}
        - STREAM_THINKING_AS_CONTENT=${STREAM_THINKING_AS_CONTENT}
        - ENABLE_AUTO_MODEL_SWITCHING=${ENABLE_AUTO_MODEL_SWITCHING}
        - GEMINI_MODERATION_HARASSMENT_THRESHOLD=${GEMINI_MODERATION_HARASSMENT_THRESHOLD}
        - GEMINI_MODERATION_HATE_SPEECH_THRESHOLD=${GEMINI_MODERATION_HATE_SPEECH_THRESHOLD}
        - GEMINI_MODERATION_SEXUALLY_EXPLICIT_THRESHOLD=${GEMINI_MODERATION_SEXUALLY_EXPLICIT_THRESHOLD}
        - GEMINI_MODERATION_DANGEROUS_CONTENT_THRESHOLD=${GEMINI_MODERATION_DANGEROUS_CONTENT_THRESHOLD}
        - ENABLE_GEMINI_NATIVE_TOOLS=${ENABLE_GEMINI_NATIVE_TOOLS}
        - ENABLE_GOOGLE_SEARCH=${ENABLE_GOOGLE_SEARCH}
        - ENABLE_URL_CONTEXT=${ENABLE_URL_CONTEXT}
        - GEMINI_TOOLS_PRIORITY=${GEMINI_TOOLS_PRIORITY}
        - DEFAULT_TO_NATIVE_TOOLS=${DEFAULT_TO_NATIVE_TOOLS}
        - ALLOW_REQUEST_TOOL_CONTROL=${ALLOW_REQUEST_TOOL_CONTROL}
        - ENABLE_INLINE_CITATIONS=${ENABLE_INLINE_CITATIONS}
        - INCLUDE_GROUNDING_METADATA=${INCLUDE_GROUNDING_METADATA}
        - INCLUDE_SEARCH_ENTRY_POINT=${INCLUDE_SEARCH_ENTRY_POINT}
    image: dauntearl/gemini-cli:worker
    networks:
      - daunt-network
    ports:
      - "8787:8787"
    env_file:
      - .env
    restart: unless-stopped

networks:
  daunt-network:
    external: true
    driver: bridge
